name: build-images

# Builds every image this deployment needs from the AGPL snapshot in this repo.
# The upstream fork only published appflowy-cloud + appflowy-web; the worker,
# the admin console and the nginx edge are built here too so that nothing is
# pulled from the commercial `appflowyinc/*` images (which enforce the 1-seat
# Free Tier). The only third-party image kept is `appflowyinc/gotrue`, which is
# a Supabase auth fork with no seat logic.
#
# PUBLIC_HOST is baked into the web SPA: Vite resolves import.meta.env at build
# time, so the image is tied to the deployment's public host. Changing the
# Railway domain means rebuilding appflowy-web.

on:
  workflow_dispatch:
    inputs:
      public_host:
        description: "Public base URL baked into the web image (no trailing slash)"
        required: false
        default: "https://edge-production-cc0fa50a.up.railway.app"
      tag:
        description: "Image tag to push"
        required: false
        default: "v2025.07-1"
      only:
        description: "Comma-separated jobs to run (cloud,worker,admin,web,edge). Empty = all."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  PUBLIC_HOST: ${{ github.event.inputs.public_host || 'https://edge-production-cc0fa50a.up.railway.app' }}
  TAG: ${{ github.event.inputs.tag || 'v2025.07-1' }}
  REGISTRY: ghcr.io/thioye97

jobs:
  # The three Rust images are independent build graphs; running them on
  # separate runners trades duplicated dependency compilation for wall-clock.
  cloud:
    if: inputs.only == '' || contains(format(',{0},', inputs.only), ',cloud,')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/appflowy-cloud:${{ env.TAG }}
          cache-from: type=gha,scope=cloud
          cache-to: type=gha,mode=max,scope=cloud

  worker:
    if: inputs.only == '' || contains(format(',{0},', inputs.only), ',worker,')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/appflowy-worker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/appflowy-worker:${{ env.TAG }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  admin:
    if: inputs.only == '' || contains(format(',{0},', inputs.only), ',admin,')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./admin_frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/appflowy-admin:${{ env.TAG }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

  web:
    if: inputs.only == '' || contains(format(',{0},', inputs.only), ',web,')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Derive WS host
        run: echo "WS_HOST=${PUBLIC_HOST#https://}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout AppFlowy-Web (pinned 2025-07-22)
        uses: actions/checkout@v4
        with:
          repository: AppFlowy-IO/AppFlowy-Web
          ref: db92f1d965d8e99dc99a1cbd63bbf6dc081649f2
          path: web-src
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/web/Dockerfile.pinned
          push: true
          tags: ${{ env.REGISTRY }}/appflowy-web:${{ env.TAG }}
          build-args: |
            AF_BASE_URL=${{ env.PUBLIC_HOST }}
            AF_GOTRUE_URL=${{ env.PUBLIC_HOST }}/gotrue
            AF_WS_URL=wss://${{ env.WS_HOST }}/ws/v1
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  edge:
    if: inputs.only == '' || contains(format(',{0},', inputs.only), ',edge,')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/edge/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/appflowy-edge:${{ env.TAG }}
          cache-from: type=gha,scope=edge
          cache-to: type=gha,mode=max,scope=edge
